<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶連鎖マインスイーパ</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin-top: 20px;
        }
        #ui-panel {
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 450px; /* ステータスバーが広がるため少し拡張 */
        }
        #difficulty-selector {
            margin-bottom: 15px;
        }
        select {
            padding: 5px;
            font-size: 16px;
        }
        #message {
            font-size: 1.1em;
            font-weight: bold;
            height: 1.5em;
            margin-bottom: 10px;
            color: #333;
        }
        #info-bar {
            margin-bottom: 15px;
            font-size: 1em; /* 少しコンパクトに調整 */
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        #board-container {
            max-width: 95vw;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        #board {
            display: grid;
            gap: 1px;
            background-color: #999;
            padding: 3px;
            border-radius: 4px;
            margin: 0 auto;
        }
        .cell {
            width: 25px;
            height: 25px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            user-select: none;
            box-shadow: inset -1.5px -1.5px #999, inset 1.5px 1.5px #eee;
        }
        .cell.revealed {
            background-color: #e6e6e6;
            box-shadow: inset 1px 1px #999;
            cursor: default;
        }
        .cell.flagged {
            color: red;
            font-size: 12px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #666;
            background-color: #e0e0e0;
            width: 100%;
        }
        button:hover { background-color: #d0d0d0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div id="difficulty-selector">
            <label for="level">難易度: </label>
            <select id="level">
                <option value="beginner">初級 (9x9, 地雷10個)</option>
                <option value="intermediate">中級 (16x16, 地雷40個)</option>
                <option value="advanced">上級 (30x16, 地雷99個)</option>
            </select>
        </div>
        <div id="message">難易度を選んでスタート</div>
        <div id="info-bar">
            <span>⏱ <span id="timer">0</span>秒</span> | 
            <span>🚩 <span id="flag-count">0</span> / <span id="total-mines">10</span></span> | 
            <span>🧠 記憶回数: <span id="memory-count">0</span></span>
        </div>
        <button id="action-btn">ゲームスタート</button>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <script>
        const LEVELS = {
            beginner: { cols: 9, rows: 9, mines: 10, time: 5 },
            intermediate: { cols: 16, rows: 16, mines: 40, time: 10 },
            advanced: { cols: 30, rows: 16, mines: 99, time: 15 }
        };

        let currentConfig = LEVELS.beginner;
        let board = [];
        let currentState = 'Init'; 
        let timerInterval;
        let flagsPlaced = 0;
        let memoryCount = 0; // 記憶回数を管理する変数を追加

        const boardElement = document.getElementById('board');
        const messageElement = document.getElementById('message');
        const timerElement = document.getElementById('timer');
        const flagCountElement = document.getElementById('flag-count');
        const totalMinesElement = document.getElementById('total-mines');
        const memoryCountElement = document.getElementById('memory-count'); // 追加
        const actionBtn = document.getElementById('action-btn');
        const levelSelect = document.getElementById('level');

        levelSelect.addEventListener('change', (e) => {
            currentConfig = LEVELS[e.target.value];
            totalMinesElement.textContent = currentConfig.mines;
            initEmptyBoard();
        });

        function getNumberColor(num) {
            const colors = ['#000', 'blue', 'green', 'red', 'darkblue', 'darkred', 'teal', 'black', 'gray'];
            return colors[num] || '#000';
        }

        function getNeighbors(index) {
            const x = index % currentConfig.cols;
            const y = Math.floor(index / currentConfig.cols);
            let neighbors = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < currentConfig.cols && ny >= 0 && ny < currentConfig.rows) {
                        neighbors.push(ny * currentConfig.cols + nx);
                    }
                }
            }
            return neighbors;
        }

        function initEmptyBoard() {
            clearInterval(timerInterval);
            currentState = 'Init';
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 25px)`;
            boardElement.style.gridTemplateRows = `repeat(${currentConfig.rows}, 25px)`;
            
            messageElement.textContent = "スタートを押して開始";
            messageElement.style.color = "#333";
            actionBtn.textContent = "ゲームスタート";
            
            timerElement.textContent = "0";
            flagsPlaced = 0;
            flagCountElement.textContent = "0";
            memoryCount = 0; // 初期化
            memoryCountElement.textContent = "0"; // 初期化
            levelSelect.disabled = false;

            for (let i = 0; i < currentConfig.cols * currentConfig.rows; i++) {
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                boardElement.appendChild(cellEl);
            }
            actionBtn.onclick = startGame;
        }

        function startGame() {
            levelSelect.disabled = true;
            boardElement.innerHTML = '';
            board = [];
            flagsPlaced = 0;
            flagCountElement.textContent = flagsPlaced;
            memoryCount = 0;
            memoryCountElement.textContent = memoryCount;

            for (let i = 0; i < currentConfig.cols * currentConfig.rows; i++) {
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.addEventListener('contextmenu', e => { e.preventDefault(); handleCellClick(i); });
                cellEl.addEventListener('click', () => handleCellClick(i));

                board.push({
                    isMine: false, neighborMines: 0, isRevealed: false, isFlagged: false, element: cellEl
                });
                boardElement.appendChild(cellEl);
            }

            let validBoard = false;
            while (!validBoard) {
                board.forEach(c => { c.isMine = false; c.neighborMines = 0; c.isRevealed = false; c.isFlagged = false; });
                
                let placed = 0;
                while (placed < currentConfig.mines) {
                    let idx = Math.floor(Math.random() * board.length);
                    if (!board[idx].isMine) {
                        board[idx].isMine = true;
                        placed++;
                    }
                }

                for (let i = 0; i < board.length; i++) {
                    if (!board[i].isMine) {
                        board[i].neighborMines = getNeighbors(i).filter(n => board[n].isMine).length;
                    }
                }

                let zeroCells = [];
                for (let i = 0; i < board.length; i++) {
                    if (!board[i].isMine && board[i].neighborMines === 0) zeroCells.push(i);
                }

                if (zeroCells.length > 0) {
                    let firstClick = zeroCells[Math.floor(Math.random() * zeroCells.length)];
                    revealCell(firstClick);
                    validBoard = true;
                }
            }

            startMemorizePhase();
        }

        function revealCell(index) {
            const cell = board[index];
            if (cell.isRevealed || cell.isFlagged) return;
            
            cell.isRevealed = true;
            cell.element.classList.add('revealed');

            if (cell.neighborMines === 0) {
                getNeighbors(index).forEach(n => revealCell(n));
            }
        }

        function startMemorizePhase() {
            currentState = 'Memorize';
            
            // 記憶回数を加算して表示を更新
            memoryCount++;
            memoryCountElement.textContent = memoryCount;

            messageElement.textContent = "開いたマスの数字を記憶して！";
            messageElement.style.color = "#333";
            actionBtn.textContent = "記憶完了 (スキップ)";
            actionBtn.onclick = () => {
                clearInterval(timerInterval);
                startPlayPhase();
            };

            board.forEach(cell => {
                if (cell.isRevealed) {
                    if (cell.neighborMines > 0) {
                        cell.element.textContent = cell.neighborMines;
                        cell.element.style.color = getNumberColor(cell.neighborMines);
                    } else {
                        cell.element.textContent = ''; 
                    }
                }
            });

            let timeLeft = currentConfig.time;
            timerElement.textContent = timeLeft;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    startPlayPhase();
                }
            }, 1000);
        }

        function startPlayPhase() {
            currentState = 'Play';
            messageElement.textContent = "記憶を基に旗を立てて展開！";
            actionBtn.textContent = "立てた旗を基に連鎖展開";
            actionBtn.onclick = openCellsBasedOnFlags;

            board.forEach(cell => {
                if (cell.isRevealed) {
                    cell.element.textContent = ''; 
                }
            });
        }

        function handleCellClick(index) {
            if (currentState !== 'Play') return;
            const cell = board[index];
            if (cell.isRevealed) return;

            if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.textContent = '';
                cell.element.classList.remove('flagged');
                flagsPlaced--;
            } else {
                if (flagsPlaced >= currentConfig.mines) return;
                cell.isFlagged = true;
                cell.element.textContent = '🚩';
                cell.element.classList.add('flagged');
                flagsPlaced++;
            }
            flagCountElement.textContent = flagsPlaced;
        }

        function openCellsBasedOnFlags() {
            if (currentState !== 'Play') return;
            
            let isGameOver = false;
            let chainReactionOccurred = true;

            while (chainReactionOccurred && !isGameOver) {
                chainReactionOccurred = false;
                let cellsToOpen = new Set();
                
                board.forEach((cell, index) => {
                    if (cell.isRevealed && cell.neighborMines > 0) {
                        const neighbors = getNeighbors(index);
                        const flagCount = neighbors.filter(n => board[n].isFlagged).length;
                        
                        if (flagCount === cell.neighborMines) {
                            neighbors.forEach(n => {
                                if (!board[n].isRevealed && !board[n].isFlagged) {
                                    cellsToOpen.add(n);
                                }
                            });
                        }
                    }
                });

                if (cellsToOpen.size > 0) {
                    cellsToOpen.forEach(index => {
                        if (isGameOver) return;
                        const cell = board[index];
                        if (cell.isMine) {
                            isGameOver = true;
                            cell.element.classList.add('revealed');
                            cell.element.textContent = '💣';
                            cell.element.style.backgroundColor = 'red';
                        } else {
                            if (!cell.isRevealed) {
                                revealCell(index);
                                chainReactionOccurred = true; 
                            }
                        }
                    });
                }
            }

            if (isGameOver) {
                currentState = 'Result';
                messageElement.textContent = "地雷爆発！ゲームオーバー...";
                messageElement.style.color = "red";
                actionBtn.textContent = "最初からやり直す";
                actionBtn.onclick = initEmptyBoard;
                revealAllMines();
            } else if (checkWin()) {
                currentState = 'Result';
                messageElement.textContent = `完全クリア！（記憶回数: ${memoryCount}回）`;
                messageElement.style.color = "green";
                actionBtn.textContent = "もう一度遊ぶ";
                actionBtn.onclick = initEmptyBoard;
                
                board.forEach(c => {
                    if (c.isMine) {
                        c.element.textContent = '🚩';
                        c.element.classList.add('flagged');
                    } else if (c.isRevealed && c.neighborMines > 0) {
                        c.element.textContent = c.neighborMines; 
                        c.element.style.color = getNumberColor(c.neighborMines);
                    }
                });
            } else {
                startMemorizePhase();
            }
        }

        function checkWin() {
            return board.every(c => c.isMine || c.isRevealed);
        }

        function revealAllMines() {
            board.forEach(cell => {
                if (cell.isMine) {
                    cell.element.classList.add('revealed');
                    if (!cell.isFlagged) cell.element.textContent = '💣';
                } else if (cell.isFlagged) {
                    cell.element.textContent = '❌'; 
                }
            });
        }

        initEmptyBoard();
    </script>
</body>
</html>
